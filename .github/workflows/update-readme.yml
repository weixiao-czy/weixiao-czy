name: Auto Update README Projects

on:
  schedule:
    - cron: "0 */6 * * *" # 每 6 小时自动检查并同步一次
  workflow_dispatch:      # 允许在 Actions 页面手动一键触发
  push:
    branches: [ main ]
    paths:
      - "update_readme.py"

permissions:
  contents: write # 赋予机器人直接把修改写回 README.md 的权限

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch and Update README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python update_readme.py

      - name: Commit and Push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: auto-sync pinned and recent projects"
          git push
